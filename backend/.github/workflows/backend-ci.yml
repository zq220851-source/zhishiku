name: MedRep platform backend CI
on:
  push:
    paths:
      - 'platform_core/**'
      - 'alembic/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'deploy/**'
      - 'compose*.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'platform_core/**'
      - 'alembic/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'deploy/**'
      - 'compose*.yaml'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
jobs:
  sqlite-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q tests
  postgresql-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medrep_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_for_deployment
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d medrep_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci_only_not_for_deployment@127.0.0.1:5432/medrep_ci
      MEDREP_ALLOW_TEST_DATABASE: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q tests/test_postgres_acceptance.py
