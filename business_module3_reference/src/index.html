<script>
'use strict';
const icons={book:'<path d="M3 4h6a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H3z"/><path d="M21 4h-6a3 3 0 0 0-3 3v14a4 4 0 0 1 4-2h5z"/>',home:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v18M12 8h5M12 12h5M12 16h3"/>',saved:'<path d="M6 3h12v18l-6-4-6 4z"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7M12 7v5l3 2"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="white"/><circle cx="16" cy="17" r="3" fill="white"/>',sources:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M4 12a8 8 0 0 0 14 6"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',external:'<path d="M14 3h7v7m0-7L10 14M11 3H3v18h18v-8"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4 10-10"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v.1"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H4l-2 3V11a9 9 0 0 1 19 0z"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.info)+'</svg>';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=v=>{try{const u=new URL(v);return u.protocol==='https:'?esc(u.href):'#';}catch{return '#';}};
function storageRead(key,fallback){try{const v=JSON.parse(localStorage.getItem((window.medrepSourceMode===true?'medrep-source:':'medrep:')+key));return v??fallback;}catch{return fallback;}}
function save(key,value){try{localStorage.setItem((config.sourceMode==='MODULE1'?'medrep-source:':'medrep:')+key,JSON.stringify(value));}catch{toast('浏览器存储不可用，本次更改仅在当前页面保留。');}}
let prefs=storageRead('prefs',{length:'standard'});
if(!['brief','standard'].includes(prefs.length))prefs.length='standard';
let bookmarks=storageRead('bookmarks',{}),reads=storageRead('reads',{});
if(!bookmarks||Array.isArray(bookmarks)||typeof bookmarks!=='object')bookmarks={};if(!reads||Array.isArray(reads)||typeof reads!=='object')reads={};
let readingLanguage=storageRead('reading-language','zh');const translationBusy=new Set(),translationMessages={};
let config={sourceMode:'LOADING',topics:[],products:[],sources:[],delivery:{},profile:null},digest=null,mode=storageRead('mode','live'),view='home',query='',loading=false,error='',ticket=0,controller;
let scholar=null,scholarLoading=false,scholarError='',scholarInput={hospital:'',name:''},workFocus='colon';
// Only an explicit user click transfers doctor identity and public, unverified research leads.
function doctorPrepUrl(profile){
 const doctor=[profile.hospital,profile.name].filter(Boolean).join(' · ').slice(0,80);
 const items=[...(profile.papers||[]),...(profile.events||[])].filter(x=>x.sourceUrl||x.url).slice(0,3);
 const facts=['模块三检索的公开学术线索；作者身份、研究关联和是否与本次交流相关均须由本人核实。',
   ...items.map(x=>'公开线索（待核对）：'+String(x.translatedTitle||x.title||'标题未知').slice(0,110)+'；来源：'+String(x.sourceUrl||x.url).slice(0,200))].join('\n').slice(0,1800);
 return 'http://127.0.0.1:8892/?'+new URLSearchParams({flow:'doctor',doctor,facts}).toString();
}

if(!['live','sample'].includes(mode))mode='sample';
const $=s=>document.querySelector(s),all=s=>[...document.querySelectorAll(s)];
const brand=icon('book')+'<div><strong>知识与前沿</strong><span>公开信息与原知识库</span></div>';
all('[data-brand]').forEach(e=>e.innerHTML=brand);$('#menu').innerHTML=icon('menu');
const names={home:'日常日报',saved:'我的收藏',history:'阅读记录',profile:'工作背景',scholar:'医生公开学术资料',sources:'信息来源'};
all('[data-view]').forEach(b=>{b.innerHTML=icon(b.dataset.view)+names[b.dataset.view];b.onclick=()=>{location.hash=b.dataset.view;$('#sidebar').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');};});
$('#menu').onclick=()=>{const on=$('#sidebar').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(on));};
window.addEventListener('hashchange',()=>{view=names[location.hash.slice(1)]?location.hash.slice(1):'home';query='';render();});
let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3500);}
function topicNames(){return config.profile?.marketed?.map(p=>p.name).join('、')||'IO 免疫肿瘤方向';}
function allItems(){return [...(digest?.industry||[]),...(digest?.learning||[])];}
function findItem(id){return allItems().find(x=>x.id===id)||bookmarks[id]?.item||reads[id]?.item;}
function formatTime(v){return v?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v)):'—';}
function modeLabel(x){return x.summaryMode==='editorial_example'?'历史学习样例':x.summaryMode==='ai_draft'?'AI 摘要 · 待核验':x.summaryMode==='metadata_only'?'仅有标题与链接':'来源原文摘要';}
function displaySource(i){if(readingLanguage==='en')return i.source;return {'Current medical research and opinion':'《当代医学研究与观点》','Critical reviews in oncology/hematology':'《肿瘤学与血液学评论》'}[i.source]||i.source;}
function displayKind(i){return readingLanguage==='zh'&&i.kind==='Review'?'综述':i.kind;}
function itemDate(i){return i.publishedAt?'发布 '+i.publishedAt:i.listedAt?'来源收录 '+i.listedAt:'发布日期未知';}
function filtered(items){const q=query.toLowerCase().trim();return q?items.filter(i=>[i.title,i.summary,i.translation?.title,i.translation?.abstract,i.source,i.kind].join(' ').toLowerCase().includes(q)):items;}
function isEnglishItem(i){return !!i.abstract&&!/[\u3400-\u9fff]/.test(i.originalTitle||i.title||'');}
function readingCopy(i){
 if(isEnglishItem(i)&&readingLanguage==='zh'&&i.translation)return {title:i.translation.title,summary:i.translation.abstract.slice(0,350)+(i.translation.abstract.length>350?'…':''),body:i.translation.abstract,label:'中文摘要译文 · 待核验',translated:true};
 if(isEnglishItem(i)&&readingLanguage==='zh')return {title:'中文译文准备中',summary:'这篇文献尚未完成标题及完整来源摘要的中文翻译。原文可在详情中切换查看。',body:'这篇文献尚未完成中文翻译。请稍后刷新，或切换英文原文阅读。',label:'待翻译',translated:false};
 if(isEnglishItem(i))return {title:i.originalTitle,summary:i.abstract.slice(0,600)+(i.abstract.length>600?'…':''),body:i.abstract,label:'英文来源摘要',translated:false};
 return {title:i.title,summary:i.summary,body:i.summary,label:modeLabel(i),translated:false};
}
function entry(i,learning=false){const isRead=!!reads[i.id],copy=readingCopy(i);return '<article class="entry '+(isRead?'is-read':'')+'"><div class="entry-meta"><span>'+esc((i.region==='CN'?'中国 · ':i.mode==='live'?'国际文献 · ':'')+displayKind(i)+(i.approvalStatus?' · '+i.approvalStatus:''))+'</span><span>'+esc(itemDate(i))+'</span>'+(isEnglishItem(i)?'<span>'+ (copy.translated?'中文译文 · 待核验':readingLanguage==='zh'?'待翻译':'英文原文')+'</span>':'')+'</div><button class="title-btn" data-open="'+esc(i.id)+'">'+esc(copy.title)+'</button><p class="entry-summary">'+esc(copy.summary)+'</p>'+(learning?'<div class="question-preview">'+icon('info')+'<span>'+esc(i.reason||'匹配我的负责方向')+'</span></div>':'')+'<div class="entry-bottom"><span>'+esc(displaySource(i))+'</span><div class="entry-buttons"><span>'+(isRead?'已读':'')+'</span><button class="icon-btn '+(bookmarks[i.id]?'saved':'')+'" data-save="'+esc(i.id)+'" aria-label="'+(bookmarks[i.id]?'取消收藏':'收藏')+esc(copy.title)+'" aria-pressed="'+!!bookmarks[i.id]+'">'+icon('saved')+'</button><button class="text-action" data-open="'+esc(i.id)+'">阅读'+icon('arrow')+'</button></div></div></article>';}
function heading(title,sub,actions=''){return '<header class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></header>';}
function footer(){return '<footer class="footer"><span>用于内部学习 · 内容未经过医学审核</span><span>MedRep Daily / 每天读懂一点新进展</span></footer>';}
function home(){const actual=digest?.mode||mode;const industry=filtered(digest?.industry||[]),learning=filtered(digest?.learning||[]),total=allItems().length,read=allItems().filter(x=>reads[x.id]).length;
const sub=actual==='sample'?'历史资料演示 · 行业动态与专业学习，收在同一份日报':'中国行业动态 + 产品与在研学习 · '+esc(digest?.date||'正在连接信息源')+' · '+(config.scheduleEnabled?'北京时间每日 08:00 云端更新':'计划北京时间每日 08:00 云端更新');
const actions='<button class="btn" id="export" aria-label="导出日报">'+icon('download')+'<span>导出日报</span></button><button class="btn primary" id="refresh" aria-label="更新日报" '+(loading?'disabled':'')+'>'+icon('refresh')+'<span>'+(loading?'正在更新':'更新日报')+'</span></button>';
const toolbar='<div class="toolbar"><div class="modes" aria-label="内容模式"><button data-mode="sample" class="'+(mode==='sample'?'selected':'')+'" aria-pressed="'+(mode==='sample')+'">历史样例</button><button data-mode="live" class="'+(mode==='live'?'selected':'')+'" aria-pressed="'+(mode==='live')+'">实时日报</button></div><div class="modes" aria-label="阅读语言"><button data-language="zh" class="'+(readingLanguage==='zh'?'selected':'')+'" aria-pressed="'+(readingLanguage==='zh')+'">中文阅读</button><button data-language="en" class="'+(readingLanguage==='en'?'selected':'')+'" aria-pressed="'+(readingLanguage==='en')+'">英文原文</button></div><div class="search">'+icon('search')+'<label class="sr-only" for="search">搜索本期内容</label><input id="search" type="search" placeholder="搜索本期内容" value="'+esc(query)+'"></div></div>';
const person=config.profile;const profileRibbon='<div class="persona-ribbon"><div class="persona-avatar" aria-hidden="true">林</div><div class="persona-ribbon-copy"><strong>'+esc(person?.name||'林知安')+'<span class="persona-tag">虚构演示人物</span></strong><p>'+esc(person?.role||'高级医药代表')+' · '+esc(person?.bu||'IO BU')+' · '+esc((person?.territory||['姑苏区','虎丘区']).join(' / '))+'</p><p>我的日报依据 '+esc(topicNames())+' 筛选；行业动态与其他代表共读。</p></div><button class="text-action" data-profile>查看我的信息 '+icon('arrow')+'</button></div>';
let notice=actual==='sample'?'这里是历史功能样例。查看中国监管与医保动态，请切换“实时日报”。':'收录近 30 天中国医保、药监动态及信达官网产品新闻稿；在研项目标明尚未获批。英文文献显示完整来源摘要的中文译文，原文可切换；尚无译文时会明确提示。';
const loadingView='<div class="loading-line"></div><div class="loading-line short"></div><div class="loading-line"></div>';
const fails=(digest?.sources||[]).filter(s=>s.status==='failed');
return heading('我的日报',sub,actions+'<a class="btn" href="#scholar">要去拜访医生？先查公开资料 →</a>')+profileRibbon+toolbar+'<div class="notice">'+icon('info')+'<p>'+notice+'</p>'+(actual==='sample'?'<button id="go-live">获取实时内容</button>':'')+'</div>'+(error?'<div class="error-box">'+esc(error)+'</div>':'')+(fails.length?'<p class="inline-error">'+esc(fails.map(s=>s.name).join('、'))+' 本次连接失败，相关板块可能不完整。可在信息来源页查看。</p>':'')+'<div class="reading-strip"><div><strong>'+(loading&&!digest?'正在收录信息…':'本期 '+total+' 条'+(query?' · 匹配 '+(industry.length+learning.length)+' 条':''))+'</strong><span class="muted"> · 负责方向：'+esc(topicNames())+'</span></div><div class="read-progress"><span>'+(loading&&!digest?'正在读取':read+'/'+total+' 已读')+'</span><div class="progress-track"><div class="progress-fill" style="width:'+(total?read/total*100:0)+'%"></div></div></div></div><div class="digest-grid"><section class="section-industry"><div class="section-head"><div><h2>行业动态</h2><p class="small">'+(actual==='live'?'中国监管与医保 · 全员共享':'历史资料 · 含国际样例')+'</p></div><span class="count">'+industry.length+' 条</span></div><div class="panel">'+(loading&&!digest?loadingView:industry.map(i=>entry(i)).join('')||'<div class="empty">'+(query?'没有匹配的行业内容。':fails.some(s=>s.id.startsWith('nhsa-')||s.id==='cdr')?'行业来源连接失败，请稍后重试。':'本期没有符合筛选条件的行业动态。')+'</div>')+'</div></section><section class="section-learning"><div class="section-head"><div><h2>产品与在研学习</h2><p class="small"><span class="topic-label">'+esc(topicNames())+'</span> · 根据我的方向筛选</p></div><button class="text-action" id="edit-topics">查看负责管线 '+icon('arrow')+'</button></div><div class="panel">'+(loading&&!digest?loadingView:(learning.length&&actual==='live'&&!digest?.learning?.some(i=>i.region==='CN')?'<p class="small" style="margin-bottom:18px">当前国内来源近 30 天未筛到本方向内容；以下为国际文献补充，不代表中国批准或医保准入。</p>':'')+learning.map(i=>entry(i,true)).join('')||'<div class="empty">'+(query?'没有匹配的学习内容。':'近 30 天暂无匹配的学习内容。')+'</div>')+'</div></section></div>'+footer();}
function collection(kind){const store=kind==='saved'?bookmarks:reads;const items=Object.values(store).filter(x=>x?.item).sort((a,b)=>b.at.localeCompare(a.at)).map(x=>x.item);const sub=kind==='saved'?'留下值得继续了解的研究与行业信息。':'回看已经读过的内容，接着上次的学习。';return heading(names[kind],sub)+'<div class="collection" style="margin-top:24px">'+(items.length?items.map(i=>entry(i)).join(''):'<div class="empty">'+(kind==='saved'?'还没有收藏。阅读日报时，点击书签即可保存。':'还没有阅读记录。打开一条日报，阅读后标记为已读。')+'<br><button class="text-action" data-home>去阅读日报 '+icon('arrow')+'</button></div>')+'</div>'+footer();}
function profilePage(){const p=config.profile;if(!p)return heading('我的信息','正在加载演示人物档案…');const stat=(n,label)=>'<div class="profile-stat"><strong>'+n+'</strong><span>'+label+'</span></div>';const pipeline=[...p.marketed.map(x=>'<div class="pipeline-card"><span class="small">已上市 · 负责产品</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.generic||'')+' · '+esc(x.target)+'</p></div>'),...p.learning.map(x=>'<div class="pipeline-card investigational"><span class="small">在研学习 · 尚未获批</span><h3>'+esc(x.name)+'</h3><p>'+esc(x.target)+' · 仅用于前沿学习，不作为已上市产品推广</p></div>')].join('');const hospital=p.hospitals.map((h,index)=>'<details class="hospital-card" '+(index===0?'open':'')+'><summary><strong>'+esc(h.name)+'</strong><span class="small">'+esc(h.district)+' · '+h.doctorCount+' 位医生 · '+h.keyCount+' 位关键人</span></summary><div class="hospital-doctors">'+h.doctors.map(d=>'<div class="doctor-chip">'+esc(d.name)+' · '+esc(d.role)+(d.key?'<em>关键人</em>':'')+'</div>').join('')+'</div></details>').join('');return heading('我的信息','一眼了解日报为什么推给我这些内容。')+'<div class="profile-hero"><div><span class="persona-tag">虚构演示人物</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.role)+' · '+esc(p.bu)+' · '+esc(p.territory.join(' / '))+'</p><p>每天一份日报：行业动态供所有代表共读；专业学习根据我的已上市产品和在研关注方向筛选。</p></div><button class="btn primary" data-home>查看我的日报 '+icon('arrow')+'</button></div><div class="profile-stats">'+stat(p.marketed.length+' + '+p.learning.length,'已上市负责产品 + 在研学习')+stat(p.hospitalCount,'演示覆盖医院')+stat(p.doctorCount,'演示医生')+stat(p.keyCount,'演示关键人')+'</div><section class="profile-section"><h2>与工作中心相关的公开医生案例</h2><p>'+esc(p.publicDoctorExample.name)+' · '+esc(p.publicDoctorExample.hospital)+'。公开资料显示消化道肿瘤与免疫治疗方向；此人不是演示档案中的虚构覆盖医生，也不代表实际客户分配。</p><button class="btn primary" data-scholar-example>查看公开学术证据 '+icon('arrow')+'</button></section><section class="profile-section"><h2>我的管线</h2><p>已上市产品决定个性化匹配；在研项目只进入学习，明确标注尚未获批。</p><div class="pipeline-cards">'+pipeline+'</div></section><section class="profile-section"><h2>辖区与医院</h2><p>'+esc(p.territory.join('、'))+' · 点击医院查看演示医生与关键人。</p><div class="hospital-list">'+hospital+'</div></section><div class="profile-disclaimer">'+esc(p.note)+' <a href="'+url(p.hospitals[0]?.sourceUrl)+'" target="_blank" rel="noopener noreferrer">查看医院名称公开来源 '+icon('external')+'</a></div><section class="settings-section"><div><h2>日报阅读偏好</h2><p>更改篇幅只影响阅读数量，负责管线仍以此档案为准。</p></div><div class="settings-panel"><div class="field"><label for="length">日报篇幅</label><select id="length"><option value="brief" '+(prefs.length==='brief'?'selected':'')+'>精简阅读 · 最多 2 条行业 + 3 条学习</option><option value="standard" '+(prefs.length!=='brief'?'selected':'')+'>标准阅读 · 最多 4 条行业 + 6 条学习</option></select></div><button class="btn" id="save-length">保存阅读偏好</button></div></section><section class="settings-section"><div><h2>投递预览</h2><p>网页阅读已可用；飞书仅作为可选渠道演示。</p></div><div class="settings-panel"><p class="small">飞书状态：'+(config.delivery?.feishu?.status==='configured'?'应用凭证已配置；仍需员工映射':'尚未连接企业飞书')+' · 以下仅预览，不会发送消息。</p><button class="btn" id="preview-delivery">预览飞书日报</button><pre class="delivery-preview hidden" id="delivery-preview"></pre></div></section>'+footer();}
function workCenterView(s){
 const center=config.profile?.workCenter;if(!center)return '';
 const evidence=[...(s.papers||[]).map(p=>({kind:'论文',title:p.translatedTitle||p.title,raw:p.title,url:p.sourceUrl,date:p.date})),...(s.events||[]).map(e=>({kind:e.kind,title:e.translatedTitle||e.title,raw:[e.title,e.snippet,e.translatedSnippet].join(' '),url:e.url,date:e.date}))];
 const matches=f=>evidence.filter(item=>f.terms.some(term=>item.raw.toLowerCase().includes(term.toLowerCase())));
 const focus=center.focus.find(f=>f.id===workFocus)||center.focus[0];const selected=matches(focus);
 const rows=center.focus.map(f=>{const list=matches(f),papers=list.filter(x=>x.kind==='论文').length,events=list.length-papers;return '<button class="focus-row '+(f.id===focus.id?'active':'')+'" data-work-focus="'+esc(f.id)+'" aria-pressed="'+(f.id===focus.id)+'"><span class="focus-row-top"><strong>'+esc(f.name)+'</strong><span>'+papers+' 篇论文 · '+events+' 条活动</span></span><span class="focus-track"><i style="width:'+Math.min(100,list.length*16)+'%"></i></span></button>';}).join('');

async function requestTranslation(id){
 const item=findItem(id);if(!item||translationBusy.has(id))return;translationBusy.add(id);delete translationMessages[id];openDetail(id,false);
 try{const response=await fetch('/api/translation?'+new URLSearchParams({id}),{signal:AbortSignal.timeout(55000)}),data=await response.json();
  if(!response.ok||data.status!=='ready')throw new Error(data.message||data.error||'暂时无法翻译，请稍后重试。');
  const current=findItem(id);if(!current||current.originalTitle!==data.sourceTitle||current.abstract!==data.sourceAbstract)throw new Error('来源内容已变化，请刷新日报后重新翻译。');
  current.translation=data.translation;for(const store of [bookmarks,reads])if(store[id])store[id].item={...store[id].item,translation:data.translation};save('bookmarks',bookmarks);save('reads',reads);
  readingLanguage='zh';save('reading-language',readingLanguage);toast('中文译文已就绪');
 }catch(e){translationMessages[id]=e.name==='TimeoutError'?'翻译请求超时，可重试。':e.message;toast(translationMessages[id]);}
 finally{translationBusy.delete(id);render();if($('#detail').open&&$('#detail-body').dataset.articleId===id)openDetail(id,false);}
}
