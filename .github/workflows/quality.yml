name: Source security and integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source safety scan
        run: python scripts/prepublish_check.py
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Backend focused integration tests
        working-directory: backend
        run: python -m pytest -q tests/test_dual_practice_restore.py tests/test_feishu_h5_sso.py integration_tests/test_real_visit_dialogue.py
      - name: Mobile contract tests
        working-directory: mobile_app
        run: node --test tests/*.test.mjs
      - name: Install mobile dependencies
        working-directory: mobile_app
        run: npm install --no-audit --no-fund
      - name: Production web build
        working-directory: mobile_app
        run: npm run build
