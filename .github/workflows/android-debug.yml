name: Android debug build (internal testing)
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check mobile API contracts
        run: npm run test:contract
      - name: Build web assets
        env:
          VITE_PLATFORM_API_URL: ${{ vars.STAGING_API_ORIGIN }}
        run: npm run build
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload unsigned debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medrep-coach-android-debug
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
