version: 1
plan:
  name: '药代拜访陪练 Agent · Phase 0 决策冻结（多专家并行）'
  max_concurrency: 6
  max_consecutive_failures: 2
  max_cycles: 8
  auto_reject_retries: 1
tasks:
  # ============ Cycle 1：五条互不依赖的轨道，真并行 ============
  - id: d1-profile-schema
    title: 'D1 医生画像卡 schema v1'
    prompt: |
      你负责 Phase 0 任务 D1：冻结「医生画像卡」的 schema。这是整个产品的入口数据结构，所有下游模块都以它为输入。

      背景材料（必读，按顺序）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看第 0 节（6 处结构性调整）、D1 行、以及第 10 节附录的数据结构草案
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 1：场景配置器」全文

      你要交付的产物：/workspace/output/phase0/D1-医生画像卡schema.md

      必须包含的内容：
      1. **完整字段表**：字段名（英文 key）、中文名、取值域（枚举全部列出）、默认值、必填与否、所属层级（语气层 / 追问粒度层 / 提问内容层 / 交互形态层）、一句话说明「为什么需要它」、「不填会怎样」
      2. **标签池明细**：DISC 四型主型+辅型；情绪标签池（≥8 个）；说话风格标签池（≥8 个）；追问三轴（追问深度 3 档 / 耐心度 3 档 / 关注点 4 类）。每个枚举值配一句**一线药代看得懂的白话解释**——用业务语言，不要用内部黑话。
      3. **参数分层论证**：明确论证 DISC 只作用于语气层、追问三轴作用于追问粒度层，并给出**正交性验证样例**：改语气字段时追问三轴的取值与医生提问内容不变；改追问深度字段时语气不变。给出至少 2 组这样的对照样例。
      4. **无效字段识别**：逐字段自查——如果这个字段怎么选，AI 医生的实际表现都没有差异，它就是无效设计，必须指出来并给出删除或改造建议。这一节宁可写「未发现无效字段」，也要逐字段给出你的判断依据。
      5. **JSON Schema**：给出可直接落库的 JSON Schema 代码块（放在文末），draft-07 或 2020-12 均可，字段名与你的字段表严格一致。
      6. **可用性走查**：以第一次使用这个界面的药代视角走查一遍——能否在 3 分钟内配完一张画像卡？哪些字段可能误选？给出改进建议。

      边界：不要写生成策略、不要写评分规则、不要写后端接口实现——那些是别的任务负责的。你只交付 schema 本身。
      不要编造法规或临床数据引用。
    assigned_to: product-designer
    verified_by:
      - Verifier
      - medical-affairs
    verify_prompt:
      Verifier: |
        独立验证 /workspace/output/phase0/D1-医生画像卡schema.md，不要采信文档里的自述结论，逐条自己核对：
        1. 逐字段检查字段表与文末 JSON Schema 是否**严格一致**（字段名、类型、枚举值、必填性四者都要对得上）。任何一处不一致即 FAIL。
        2. 检查任务拆解文档 D1 行的 3 条验收标准是否逐条被覆盖：(a) 每字段有枚举/取值域/默认值；(b) 枚举值通过一线药代可理解性测试；(c) 有"同画像两个问题生成结果不同"的样例证明追问三轴生效。
        3. 正交性验证样例是否真的能证明两件事：改语气不影响追问粒度、改追问粒度不影响语气。样例必须具体到取值和预期表现，不能只是口号。
        4. 检查是否存在无效字段被漏掉——一个字段若在全文中找不到任何"它如何影响医生表现"的说明，判定为未论证。
        5. 全文不得出现任何杜撰的法规、指南、临床数据引用。
        FAIL 条件：schema 与字段表不一致、缺正交性样例、无效字段未逐个自查、编造出处。
      medical-affairs: |
        以医学事务视角独立审阅 /workspace/output/phase0/D1-医生画像卡schema.md：
        1. 科室、职称、年龄段、学术主题相关的枚举值是否与真实临床科室划分和医学常识相符，有无臆造或明显不存在的科室/亚专业。
        2. 关注点四类（疗效/安全性/费用流程等）与追问深度三档的划分是否符合医生真实提问习惯。
        3. 标签池中是否存在医学上不成立的组合（例如某科室下不可能出现的提问关注点）。
        4. 有无任何暗示支持超适应症用药的表述。
        FAIL 条件：出现臆造的科室/亚专业、医学上不成立的组合、有超适应症倾向表述。
    timeout_ms: 1800000

  - id: d2-compliance-rules
    title: 'D2 合规判定规则表（含语义方向判定）'
    prompt: |
      你负责 Phase 0 任务 D2：冻结「合规判定规则表」。这是整个产品风险最高的一份文档——写错了会把诚实药代的合规拒绝话术判成违规，产品当场失去可信度。

      背景材料（必读）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看「模块 3」轨道 A 维度 5、第 8 节风险 R5、以及第 2 节 Phase 0 中 D2 的验收标准
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 3」合规维度与「模块 5.3 与考核的边界」

      你要交付的产物：/workspace/output/phase0/D2-合规判定规则表.md

      必须包含的内容：
      1. **判定链路设计**：必须是**串行两段式**——第一段判定语境方向（提议/索要/提供 vs 拒绝/否定/劝阻 vs 中性陈述），第二段才做实体级违规匹配。画出流程图（文字流程或 SVG 均可），明确标注：第一段判定为「拒绝/否定/劝阻」时，实体敏感词命中**一律不构成违规**。写清楚为什么这个顺序不可颠倒。
      2. **语境方向分类器标签集**：枚举所有方向类别，每个类别给判定线索词与 1 个真实例句。
      3. **硬红线清单**：规则ID、风险等级、判定条件、违规示例（药代视角的第一人称原话）、**同词不同判的合规反例**（同一敏感词但因语境合规而不违规）、法规依据。
         至少覆盖：超适应症/超说明书推荐、承诺疗效、贬低竞品、诱导利益（回扣/返利/赞助个人）、以销量或处方量为条件的利益输送、未经授权使用他人姓名或病例、绝对化用语与无出处引用。
         每个红线 ≥5 个违规示例 + ≥5 个合规反例。合规反例是硬要求。
      4. **严重度分级**：区分「硬红线（一票否决）」与「表述不规范（维度内扣分并即时提示）」。给出判级标准。
      5. **一票否决后的计分处理**：明确该轮是否计入个人均分（建议：不计入，记入重练池，组织层单独统计合规事件率），并写清理由——不能既"不通过"又"从均分消失"这两种口径并存。
      6. **误伤自查**：站在「诚实、谨慎、专业的药代」立场逐条审查你的规则。列出可能被误伤的情形，以及你如何防止它。这份自查表是交付物的核心部分之一。
      7. **法规依据**：给出法规全称 + 发布机关 + 年份。不确定的标注「待法务确认」并说明缺什么。禁止编造法条编号、文号。

      边界：不要写画像卡、不要写评分合成规则、不要写后端代码。
    assigned_to: compliance-expert
    verified_by:
      - Verifier
      - scoring-architect
    verify_prompt:
      Verifier: |
        独立对抗性验证 /workspace/output/phase0/D2-合规判定规则表.md。不要读文档的自评结论，逐项自己核对：
        1. **构造攻击用例**：自己写 10 条药代话术（含至少 4 条"拒绝/否定语境但含敏感词"的话术，如"回扣这个我们真不能谈"），按文档的判定链路逐步走一遍，记录每条的判定结果。检查文档的规则是否真能让这些全部判为合规。任一条误判即 FAIL。
        2. 检查判定链路顺序确实是"先语境方向、后实体匹配"，且拒绝语境豁免写成了明确可实现的条件。
        3. 检查每条红线是否都同时有违规示例与合规反例，且反例中的敏感词与违规示例确实是同一个词。缺反例即 FAIL。
        4. 检查"一票否决后的计分处理"口径是否唯一、无自相矛盾。文中同时出现"不通过"和"从均分剔除"而无统一说明的，判 FAIL。
        5. 检查是否有编造的法条编号或文号。发现疑似杜撰即 FAIL。
        6. 检查误伤自查表是否真实存在且有具体情形，不是空话。
        FAIL 条件：任一拒绝语境用例被规则判为违规、红线缺合规反例、计分口径矛盾、杜撰法条、误伤自查缺失。
      scoring-architect: |
        从算法可实现性视角验证 /workspace/output/phase0/D2-合规判定规则表.md：
        1. 判定链路能否落成串行的两段式代码？语境方向分类器与实体违规匹配之间的接口是否明确（输入输出是什么）？
        2. 每条红线规则是否给出了**可判定的布尔条件或明确枚举**，而非"综合判断""酌情认定"这类无法实现的表述？逐条列出无法实现的规则。
        3. 规则与规则之间是否存在重叠或冲突（同一句话触发两条互斥的规则）？
        4. 是否存在无法判定边界的模糊地带而文档未标注？
        5. 严重度分级是否可被实现为二值判定（否决/扣分/通过）？
        FAIL 条件：存在无法实现的判定条件、规则互相冲突未说明、严重度不可判定。
    timeout_ms: 1800000

  - id: d3-scoring-gate
    title: 'D3 双轨门控合成规则'
    prompt: |
      你负责 Phase 0 任务 D3：冻结「双轨评分系统的合成规则」。产品不靠打分取胜，但打分规则错了会冤判人，所以这份文档必须精确到真值表。

      背景材料（必读）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看「模块 3」全节（尤其双轨合成部分）、附录数据结构（评分/错误事件字段）、以及第 2 节 D3 的验收标准
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 3：双轨评分系统」全节

      你要交付的产物：/workspace/output/phase0/D3-双轨门控合成规则.md

      必须包含的内容：
      1. **双轨定义**：轨道 A（对话/话术 5 维度）逐维度定义 + 锚点（满分/中间分/零分各是什么样的话术）；轨道 B（专业知识运用：事实准确性 / 证据引用质量 / 场景适配性）逐项定义与锚点。锚点必须能直接用于校准，不要写"表述流畅得 4 分"这种不可校准的描述。
      2. **三维处理必须显式区分**（这是最容易做错的地方，用表格列清楚）：
         - 合规违规 → 一票否决，本轮不通过
         - 表述不规范 → 维度内扣分 + 即时提示
         - 维度不可评 → **从分母移除并重分配权重，不记 0 分**
         每类给出触发条件、数据流位置、对最终综合分的影响。
      3. **门控合成规则**（用真值表实现，不要文字描述）：
         - 知识轨道低于阈值 → 综合评定强制降档。给出阈值取值、每个降档档位、逐档的分数上限。
         - 合规触发 → 本轮不通过，且不计入个人均分、不参与平均分稀释；组织层单独统计合规事件率。写清"不参与平均分"与"记为不通过"如何共存。
         - 两轨均通过 → 按权重合成。给出初始权重（建议话术 60% / 知识 40%）与随资历上调知识权重的**具体公式或条件**（上调触发条件、上调步长、上调频次上限）。
      4. **可穷举性证明**：给出覆盖全部输入组合的真值表或决策表，至少包含：合规通过/违规 × 知识达标/不达标 × 话语术分高/低 的组合，每格给出确定的输出。明确说明决策树有多少叶节点。
      5. **非线性评分因子**：如何拉开区分度、防止"人人高分"。给出因子定义 + 预期分布特征。
      6. **校准方案**：如何用带标准分的标注集做回归、如何监控分布塌陷（给出门槛指标）。
      7. **与知识缺口的衔接**：明确"不可评分"题目如何处理——整题剔除，不进分母、不进 GAP 画像、单独计入知识缺口率。给出数据流上的处理位置。

      边界：不要写合规红线清单（那是 D2）、不要写画像卡 schema（D1）。D2 的规则你按"硬红线由 D2 定义"来引用即可。
    assigned_to: scoring-architect
    verified_by:
      - Verifier
      - compliance-expert
    verify_prompt:
      Verifier: |
        独立验证 /workspace/output/phase0/D3-双轨门控合成规则.md，不要采信文档自述：
        1. **自己走真值表**：构造至少 12 组输入（覆盖合规通过/违规 × 知识达标/超阈值/不可评分 × 话术分 40/70/95 三档），按文档规则逐组推演综合分与评定等级。记录每组结果，检查是否与文档声明一致，且每组都有唯一确定输出（无"视情况而定"）。任一组无唯一输出即 FAIL。
        2. 检查"维度不可评"是否被正确建模为"从分母移除 + 权重重分配"，而不是记 0 分或按平均分处理。这是本任务的最高优先级检查项。
        3. 检查"合规一票否决"与"计入个人均分"的口径是否唯一自洽。
        4. 检查知识轨道的"不可评分"题目是否被明确排除在分母与 GAP 画像之外。
        5. 检查 5 个话术维度与 3 个知识子项是否都有可校准的锚点定义。任一维度只有"好/一般/差"式描述即 FAIL。
        6. 检查权重上调公式是否可执行（有明确触发条件与上限），而非"适当提高"。
        FAIL 条件：真值表有歧义格、不可评维度被当作 0 分处理、口径矛盾、锚点不可校准、权重上调不可执行。
      compliance-expert: |
        从合规与考核边界视角验证 /workspace/output/phase0/D3-双轨门控合成规则.md：
        1. 文档对"合规触发后是否计入个人均分"的处理，是否与"错误留存用于训练分配和能力诊断，不直接作为人事处罚依据"的产品原则一致？是否存在被用来变相处罚药代的通道（例如通过均分间接影响考核）？若有，指出并给出修正建议。
        2. 检查"知识轨道低分强制降档"的力度是否合理——话术好但知识错，在真实拜访中危害更大，这是否被正确体现？降档是否过轻？
        3. 检查是否存在药代无法申诉、无法查看扣分依据的盲区。
        4. 检查综合评定等级的划分是否会产生误导（例如把"合规否决"和"知识不足"混在同一个低分档里，让药代误以为是自己知识差）。
        FAIL 条件：存在变相处罚通道、降档力度与"知识错危害更大"的原则相悖、存在不可申诉盲区、否决与知识不足被混为同一档。
    timeout_ms: 1800000

  - id: d4-measurability-matrix
    title: 'D4 形态×维度可测性矩阵'
    prompt: |
      你负责 Phase 0 任务 D4：冻结「交互形态 × 评分维度 的可测性矩阵」，并定义不可评维度的权重重分配规则。

      背景材料（必读）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看「模块 1.3 联系方式与语气/口吻配置」、「模块 3」轨道 A 的 5 维度表（含典型扣分信号列）、第 2 节 D4 的验收标准
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 3」轨道 A 的 5 维度定义

      你要交付的产物：/workspace/output/phase0/D4-形态维度可测性矩阵.md

      必须包含的内容：
      1. **交互形态定义**：面访 / 线上语音（电话）/ 线上视频。逐形态说明：可观测到哪些信号、不可观测到什么、开场 30 秒的具体要求差异、时间控制与打断模拟的实现前提（例如是否需要 ASR 转写与时间戳）。
      2. **完整可测性矩阵**：行 = 5 个话术评分维度（拜访阶段推进 / 需求探询深度 / 异议处理质量 / 表达与节奏控制 / 合规表达边界），列 = 3 种形态。每格必须标注：可评 / 部分可评 / 不可评，以及**具体证据来源**（对话文本 / ASR 转写 / 时间戳 / 资料递送事件 / 无）。不要留空格。
      3. **「部分可评」的处理**：说明这类维度如何折算——给出具体折算规则（例如只评可观测子项，子项权重如何归一），并给出至少 2 个维度的子项拆分示例。
      4. **权重重分配公式**：明确给出——当某维度不可评时，从分母移除该维度权重后，其余维度权重如何归一。给出公式、给出 2 个数值算例。
      5. **报告呈现要求**：报告中必须显式标注"本形态未评 XX 维度"，不得让药代误以为某维度得 0 分。给出这句提示的具体文案。
      6. **实现前置条件**：每种形态要真正支持评分，需要哪些工程能力（ASR、时间戳对齐、资料递送事件埋点等），并标注各形态的最小可用版本（MVP）可以先降级到什么程度。
      7. **形态选择建议**：从"证据可得性 × 开发成本"两个维度，给出 P0 阶段应该先做哪种形态的明确建议和理由。

      边界：不要写画像卡字段表（D1）、不要写合规红线（D2）、不要写门控合成（D3）。
    assigned_to: scoring-architect
    verified_by:
      - Verifier
      - product-designer
    verify_prompt:
      Verifier: |
        独立验证 /workspace/output/phase0/D4-形态维度可测性矩阵.md：
        1. 检查矩阵是否完整覆盖 5 维度 × 3 形态，且**没有任何空格或"待定"**。有空格即 FAIL。
        2. 逐格核对证据来源是否真实可得。特别检查：电话/线上形态下"打断应对""非语言节奏"这类需要非语言或时序证据的维度，是否被诚实标为不可评或部分可评，而不是假装可评。
        3. 检查权重重分配公式是否给出了明确算例，且算例的数值计算正确（自己算一遍）。算错即 FAIL。
        4. 检查"部分可评"的折算规则是否给出了具体子项与归一方式，而非含糊的"酌情折算"。
        5. 检查报告中未评维度的提示文案是否存在且不会误导。
        6. 检查 P0 形态建议是否给出了明确结论和理由，而不是两边都说。
        FAIL 条件：矩阵有空格、非语言维度被伪装成可评、重分配算例算错、部分可评无可执行折算、形态建议不明确。
      product-designer: |
        从产品与一线可用性视角验证 /workspace/output/phase0/D4-形态维度可测性矩阵.md：
        1. 3 种形态对"开场前 30 秒""时间控制""资料递送时机"的差异描述，是否符合真实医药拜访场景？有没有编造的、不存在的拜访环节？
        2. 「部分可评」维度被折算后，是否会造成药代看到的一个分数其实只反映部分行为，从而误导训练方向？指出具体风险。
        3. 各形态的 MVP 降级方案，是否仍然能支撑"最小闭环"——即选画像 → 练 3 题 → 拿到报告 → 记录短板？若某形态降级后闭环断裂，明确指出。
        4. 从药代视角看，这个矩阵最终在报告里呈现出来是否可理解？会不会让人困惑于"为什么这次没评某个维度"？
        FAIL 条件：场景描述失真、折算导致分数误导、MVP 降级后闭环断裂、报告呈现不可理解。
    timeout_ms: 1800000

  - id: d5-source-fingerprint
    title: 'D5 知识来源分级准入与来源指纹'
    prompt: |
      你负责 Phase 0 任务 D5：冻结「知识来源分级准入规则 + 来源指纹数据结构」。这是"让数据库敢被相信"的地基。

      背景材料（必读）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看「模块 4：真伪裁判所」全节（4.1 数据来源分级与准入 / 4.2 周更机制）、附录数据结构中的 KnowledgeItem、以及第 2 节 D5 的验收标准
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 4」全节

      你要交付的产物：/workspace/output/phase0/D5-知识来源分级与指纹.md

      必须包含的内容：
      1. **三级来源分级定义**：Ⅰ级 NMPA 核准原版说明书（法定适应症/禁忌/用法用量，最高标准）/ Ⅱ级 国家级临床指南、专家共识、药典、临床应用指导原则 / Ⅲ级 权威医学期刊、药监部门不良反应监测通报。每一级写明：包含什么、不包含什么、争议时的优先级、是否可作为"该知识点唯一正确表述"的依据。
      2. **准入与拒绝规则**：明确哪些一律不入库（网络自媒体、科普软文、未注明出处的"专家观点"、企业宣传材料、二次转述的指南解读等），给出拒绝判定条件。注意：企业宣传材料未注明出处时拒绝，但若其内容可回溯到已准入来源，可作为线索而非基准——把这个区别讲清楚。
      3. **来源指纹字段定义**：每条入库知识必须携带——来源类型、文献/说明书版本号、生效日期、审核人、原文定位（章节/页/条目）、以及**该知识点的具体陈述**。给出每个字段的类型、必填性、格式约束、示例值。给出可直接落库的 JSON Schema。
      4. **版本差异与废止机制**：如何记录"旧版 vs 新版"差异；旧版不删除、标记"已废止"并保留可追溯；新版本替代知识点后，如何反向标记受影响的场景卡、高频问题模板、评分基准。给出差异记录的数据结构。
      5. **知识缺口判定口径（关键）**：定义什么情况下一个知识点应被标记为「不可评分」而不是强行给分。至少覆盖：可信来源中不存在该知识点 / 多个来源相互冲突且无法判定 / 来源版本过旧且关键结论已变 / 所需信息超出本产品的授权范围。给出每种的判定条件与处理动作。
      6. **更新周期与 SLA**：说明书/警示语类 72 小时（工作日）内入库并标记受影响场景；指南/共识类 1 周内完成审核入库。给出监测源清单类型与分级 SLA 表，并说明 SLA 与实际团队规模的匹配性（1–2 名医学内容人员的现实可行性评估）。
      7. **审核责任**：谁入库、谁审核、争议如何裁决。给出审核人角色定义。

      边界：不要写评分规则、不要写合规红线、不要写画像卡。
      重要纪律：所有来源分级与条款表述必须可核查。法规/指南给出全称 + 发布机关 + 年份；不能确证的写「待医学复核」并说明缺什么。**严禁编造文号、批号或指南版本号**。
    assigned_to: medical-affairs
    verified_by:
      - Verifier
      - compliance-expert
    verify_prompt:
      Verifier: |
        独立验证 /workspace/output/phase0/D5-知识来源分级与指纹.md：
        1. 逐条核对文中出现的法规、指南、共识名称与发布机关、年份。**重点排查是否存在编造的文号、批号、指南版本号或年份**——杜撰来源是本任务的一票否决项。
        2. 检查来源指纹字段是否覆盖任务拆解 D5 验收标准要求的 5 项（来源类型、文献或说明书版本号、生效日期、审核人、原文定位）+ 知识点具体陈述。缺项即 FAIL。
        3. 检查拒绝入库规则是否明确覆盖了自媒体、科普软文、无出处"专家观点"三类，且可判定（不是"质量差的不要"）。
        4. 检查"不可评分"的 4 类判定口径是否每类都有可判定的条件，而不是"视情况"。
        5. 检查差异记录与废止机制是否满足"旧版不删除、标记已废止、可追溯"，以及反向标记受影响对象的机制是否存在。
        6. 检查 SLA 分级是否与任务拆解要求一致（说明书/警示语 72 小时、指南共识 1 周）。
        7. 检查知识缺口的四种情形是否都被覆盖。
        FAIL 条件：编造来源、指纹缺项、拒绝规则不可判定、不可评分口径缺失、废止机制不满足可追溯、SLA 与要求不符。
      compliance-expert: |
        从合规与证据效力视角验证 /workspace/output/phase0/D5-知识来源分级与指纹.md：
        1. 分级是否足以支撑"法定适应症、禁忌、用法用量为最高标准，任何生成内容不得偏离"这条底线？有没有哪一级来源可能绕开说明书？
        2. 三级之外的材料（企业材料、第三方解读、会议纪要）处理是否恰当——会不会有本应拒绝的材料被放进来？
        3. 差异审计与废止机制是否有被绕过的漏洞（例如旧版知识仍被白名单引用）。
        4. 审核责任设计是否留了"无人负责"的缝隙——谁入库、谁审核、争议谁裁决，三个角色是否都有明确归属。
        5. SLA 与医学内容团队规模的现实性评估是否诚实，还是给了一个做不到的承诺。
        FAIL 条件：存在绕过说明书的来源通道、不应入库的材料被放行、废止机制有漏洞、责任有缝隙、SLA 承诺不诚实。
    timeout_ms: 1800000

  # ============ Cycle 2：依赖 Cycle 1 产出 ============
  - id: d6-data-visibility
    title: 'D6 数据可见性与考核边界'
    prompt: |
      你负责 Phase 0 任务 D6：冻结「错误留存的数据可见性规则」与「不作为人事处罚依据」这条产品原则的工程落地。

      背景材料（必读）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 重点看「模块 5.3 与考核的边界」、第 8 节风险 R3/R4、以及第 2 节 D6 的验收标准
      2. /workspace/output/phase0/source/原始设计稿.md —— 重点看「模块 5」全节，尤其 5.2 两层聚合与 5.3 与考核的边界
      3. /workspace/output/phase0/source/phase0/D2-合规判定规则表.md —— D2 已完成，参考其第 5 项"一票否决后的计分处理"，保持口径一致

      你要交付的产物：/workspace/output/phase0/D6-数据可见性与考核边界.md

      必须包含的内容：
      1. **产品原则的正式表述**：一条写得住、经得起 HR 与法务质询的原则原文，明确"错误留存用于训练分配和能力诊断，不直接作为人事处罚依据"，并说明它的边界（可以用来做什么、不可以用来做什么）。
      2. **角色与可见性矩阵**：逐角色（药代本人 / 药代主管 / 培训运营 / 医学内容 / 组织层看板 / HR）列出：能看到什么聚合、能看到什么明细、看不到什么。**药代不可见他人错误；组织层只见聚合不见个人明细**是硬约束。给出矩阵。
      3. **权限规则（可工程化）**：给出具体的权限判定规则——用角色、数据对象、可见粒度（本人 / 本组 / 全组织聚合）、时间窗口四个维度表达，每条规则是明确条件。
      4. **组织层聚合的阈值规则**：同一错误类型在 30 天内被 N 人触发、或单人重复 3 次以上 → 进入集中处理队列。给出 N 的取值建议与依据、阈值调整机制，以及如何避免阈值本身变成对个人的计数手段。
      5. **防规避设计**：药代若知道错误会被记录，会回避高难度场景，导致训练数据失真。给出具体的缓解设计（难度标签是否对药代可见、如何分配难度、"跳过率/重练率"这类行为指标如何用而不被当作考核项）。
      6. **数据保留与删除**：错误对话片段原文属于敏感数据（可能含患者信息、病例、机构名）。给出保留期限、脱敏要求、谁有权删除、删除后对 GAP 画像的影响。
      7. **考核侧口径**：明确写死"考核可以看 GAP 收敛趋势，不看单次错误次数"，并给出趋势指标的具体定义（收敛如何度量）与展示方式（不呈现个人排名的理由）。

      边界：不要重写合规红线、不要写评分合成、不要写画像卡字段。
    assigned_to: compliance-expert
    depends_on: [d2-compliance-rules, d3-scoring-gate]
    verified_by:
      - Verifier
      - product-designer
    verify_prompt:
      Verifier: |
        独立验证 /workspace/output/phase0/D6-数据可见性与考核边界.md：
        1. 逐条检查硬约束是否被满足：药代不可见他人错误明细、组织层只见聚合不见个人明细、考核不看单次错误次数。任一被削弱或留有后门即 FAIL。
        2. 检查可见性矩阵是否覆盖任务拆解 D6 要求的全部 6 类角色，是否有空格。
        3. 检查权限规则是否可工程化（明确条件而非原则性描述）。
        4. 检查防规避设计是否给出了具体机制，而不是"我们会注意"式表态。
        5. 检查数据保留与脱敏部分是否覆盖患者信息、病例、机构名的脱敏要求与保留期限。
        6. 检查"错误留存不作为处罚依据"这条原则，是否存在与之矛盾的隐藏通道——例如通过某种聚合或趋势间接定位到个人。发现即 FAIL。
        FAIL 条件：硬约束被削弱、矩阵有空格、权限规则不可工程化、防规避为空话、无数据保留脱敏要求、原则存在后门。
      product-designer: |
        从产品与一线视角验证 /workspace/output/phase0/D6-数据可见性与考核边界.md：
        1. 一线药代看到自己的错误留存、GAP 画像、推送的训练任务，这套东西能否真正促成能力提升，还是会让人产生被监视感而不愿参与？给出具体的产品设计判断。
        2. GAP 画像的输出表述是否可行动（形如"在老虎型医生 + 异议处理场景下，合规表达边界反复出问题"），还是又退化成一个总分？
        3. 集中处理队列的阈值设计，会不会反过来变成对个人的隐性计数？判断依据是什么。
        4. 组织层看板若只给聚合，会不会让管理者反过来追问明细，从而击穿可见性隔离？这一风险文档是否预见到？
        FAIL 条件：设计会导致一线抵触且无缓解、GAP 输出不可行动、阈值构成隐性计数、未预见管理侧反查风险。
    timeout_ms: 1800000

  - id: d7-baseline-eval-set
    title: 'D7 判定回归基线集'
    prompt: |
      你负责 Phase 0 任务 D7：构建「判定回归基线集」——这是后续每一次判定逻辑改动的对照基准，也是"改完到底变好还是变坏"的唯一裁判。

      背景材料（必读）：
      1. /workspace/output/phase0/source/phase0/D2-合规判定规则表.md —— **必读**，基线集必须与 D2 的判定链路和红线规则严格对齐
      2. /workspace/output/phase0/source/phase0/D3-双轨门控合成规则.md —— **必读**，基线集还要覆盖 D3 的门控决策与"不可评分"处理
      3. /workspace/output/phase0/source/任务拆解v1.md —— 重点看第 2 节 D7 的验收标准（含标注一致性 Krippendorff α ≥ 0.8）

      你要交付的产物：
      - /workspace/output/phase0/D7-判定回归基线集.md （说明文档）
      - /workspace/output/phase0/D7-baseline-eval-set.jsonl （样本数据，每行一个 JSON）

      必须包含的内容：
      1. **样本集设计**：≥30 条标注样本，覆盖三类：(a) ≥10 条违规正例（应触发否决或扣分）；(b) ≥10 条**同词不同判的合规反例**——药代拒绝/否定/劝阻语境中含敏感词，必须全部判合规，这是本集存在的核心理由；(c) ≥10 条边界模糊或涉及"不可评分"的样本。
      2. **JSONL 字段结构**：每行至少含 sample_id、utterance（药代第一人称原话）、context（对话上下文摘要，用于语境方向判定）、profile（医生画像摘要）、expected（期望判定结果）、expected_reason（命中的规则 ID）、category（正例/反例/边界/不可评分）、dimension（涉及哪个评分维度）、trap（该样本刻意设计的陷阱是什么）。
      3. **陷阱样本设计**：至少 5 条是**刻意设计的陷阱**——例如：药代先提了一个违规请求再自己否定（"其实我本来想问能不能给点费用……算了不行"）；药代引用了第三方说法（"我们主任说别家都直接给你回扣"）；合规拒绝话术但语气生硬；用绝对化用语但同时给出了出处。逐条说明期望判定与理由。
      4. **不可评分样本**：必须包含"系统自身知识缺口"导致的不可评分样本——即药代本身回答正确，但该知识点在白名单中无可信来源。这类样本的期望判定是"不判分"，且 expected_reason 必须指向知识缺口而非药代错误。这直接防止冤判药代。
      5. **标注规范**：写出标注员的标注指引与决策树——遇到歧义怎么裁。给出 2 名标注员分歧时的裁决流程（第三人裁定）。
      6. **一致性评估方法**：如何计算标注一致性（Krippendorff α 或等价指标）、样本量与类别分布如何影响该指标的可信度、α ≥ 0.8 的验收标准如何执行。
      7. **回归使用方法**：说明这份基线集如何在后续每次判定逻辑改动后被运行——通过率怎么算、什么幅度算"改进"、什么幅度算"回归需回滚"、多个维度如何汇总成一个判定结论。给出至少 3 个"改动前后对比"的假设性例子。

      边界：不要重写 D2/D3 的规则本身，你是在为它们构建测试集。发现规则有漏洞就写进"发现的规则缺口"一节，不要自行改规则。
    assigned_to: scoring-architect
    depends_on: [d2-compliance-rules, d3-scoring-gate]
    verified_by:
      - Verifier
      - compliance-expert
    verify_prompt:
      Verifier: |
        独立验证 D7 产物（/workspace/output/phase0/D7-判定回归基线集.md 与 D7-baseline-eval-set.jsonl）：
        1. **逐行校验 JSONL**：每行是否为合法 JSON、字段是否齐全、sample_id 是否唯一、expected 与 expected_reason 是否自洽。实际解析文件统计样本数与分类分布。样本总数 <30 或某一类 <10 即 FAIL。
        2. **自己跑一遍判定**：挑出全部合规反例样本（category 含"反例"），按 D2 的判定链路逐条推演，检查期望判定是否确实应为合规。任一条期望判定与规则推导不符即 FAIL。
        3. 抽查 ≥8 条正例，确认它们确实构成违规，而不是被误标。
        4. 检查陷阱样本是否真的构成陷阱——是否存在"其实很容易判断"的伪陷阱样本。
        5. 检查"不可评分"样本的 expected_reason 是否指向知识缺口而非药代错误。
        6. 检查是否存在自相矛盾的样本（同一条话术被标了两种期望）。
        7. 检查回归使用方法是否给出了明确的通过/回滚阈值，而不是"看情况"。
        FAIL 条件：样本量或分类不达标、合规反例期望判定与规则冲突、正例误标、陷阱样本无效、不可评分归因错误、样本自相矛盾、回归阈值不明确。
      compliance-expert: |
        从合规判断正确性视角验证 D7 基线集：
        1. 逐条审阅全部合规反例样本：这些拒绝/否定语境的话术，在真实合规审核中确实应当判为合规吗？有没有哪一条其实越界了（口头拒绝但实质上仍是暗示或默许）？如有，指出具体样本。
        2. 审阅全部正例样本：是否都属于真实红线，有没有把"表述不规范"（应扣分）误标为"一票否决"的样本？
        3. 抽查陷阱样本中"第三方转述"类样本——例如药代引用"我们主任说别家都给你回扣"，这类转述在合规审核中通常如何定性？期望判定是否合理？
        4. 检查是否遗漏了某类高风险话术需要进基线集。
        5. 边界模糊样本的标注决策树是否足以让第二位标注员得到一致结果。
        FAIL 条件：反例中实际存在越界、正例中混淆扣分与否决、第三方转述类定性错误、遗漏高风险类别、标注决策树不足以保证一致性。
    timeout_ms: 1800000

  # ============ Cycle 3：合并与交叉一致性检查 ============
  - id: merge-phase0-pack
    title: '合并 Phase 0 决策冻结包并做交叉一致性检查'
    prompt: |
      你负责 Phase 0 的最终合并：把 D1–D7 七份产出合并为一份内部一致的《Phase 0 决策冻结包》，并做交叉一致性检查。

      背景材料（必读，按顺序）：
      1. /workspace/output/phase0/source/任务拆解v1.md —— 全文，作为验收基准
      2. /workspace/output/phase0/source/原始设计稿.md —— 全文，作为原始需求基准
      3. /workspace/output/phase0/D1-医生画像卡schema.md
      4. /workspace/output/phase0/D2-合规判定规则表.md
      5. /workspace/output/phase0/D3-双轨门控合成规则.md
      6. /workspace/output/phase0/D4-形态维度可测性矩阵.md
      7. /workspace/output/phase0/D5-知识来源分级与指纹.md
      8. /workspace/output/phase0/D6-数据可见性与考核边界.md
      9. /workspace/output/phase0/D7-判定回归基线集.md 与 D7-baseline-eval-set.jsonl

      你要交付的产物：/workspace/output/phase0/Phase0-决策冻结包.md

      必须包含的内容：
      1. **冻结清单**：D1–D7 各自的交付物路径、一句话摘要、责任角色、验收状态。
      2. **交叉一致性检查表（核心）**：逐项核对并给出结论（一致 / 冲突 / 待定 + 责任人）：
         - D1 画像卡的字段与 D2/D3/D4 中引用的字段名是否一致（尤其 tone_layer / inquiry_axes / channel）
         - D2 的红线规则与 D3 的严重度分级是否口径一致（哪些是硬红线）
         - D2 的"一票否决后计分处理"与 D3 的门控规则、D6 的可见性规则是否说的是同一件事
         - D3 的"不可评分剔除"与 D5 的"知识缺口判定"与 D7 的不可评分样本是否闭环
         - D4 的不可评维度与 D3 的权重重分配公式是否一致
         - D6 的权限规则是否覆盖了 D7 基线集里所有错误类型的可见性
         - D7 基线集覆盖的规则 ID 是否都在 D2 中真实存在（逐个核对 ID 有效性）
      3. **冲突清单**：所有发现的冲突逐条列出——冲突内容、涉及哪两份文档、你的建议解决方案、建议由谁最终裁决。对 D2/D3 之间"硬红线范围"这类真实分歧，不要私自抹平，要标为待裁决项并给出你的推荐。
      4. **待法务/医学确认清单**：把所有标注为「待法务确认」「待医学复核」的条目汇总成一张表，写明问题、为什么必须外部确认、若不确认会导致什么后果。
      5. **术语表**：把七份文档中可能产生歧义的术语统一（如"维度""轨道""不可评分""废止""GAP"），给出唯一定义。
      6. **进入 Phase 1 的前置条件**：明确写出——还差什么才能开始写代码。每条前置条件必须可验证（不是"要确认一下"，而是"XX 表由 YY 角色签字"）。

      纪律：
      - 合并时**不要重写各文档的技术事实**，你的职责是发现矛盾并暴露，而不是抹平。矛盾必须显式呈现。
      - 不要新增任何 D1–D7 之外的新规则。
      - 所有引用必须指向具体文件的具体小节，方便读者回查。
    assigned_to: General
    depends_on: [d1-profile-schema, d2-compliance-rules, d3-scoring-gate, d4-measurability-matrix, d5-source-fingerprint, d6-data-visibility, d7-baseline-eval-set]
    verified_by:
      - Verifier
    verify_prompt: |
      独立验证 /workspace/output/phase0/Phase0-决策冻结包.md：
      1. **自己抽查交叉一致性**：不要相信文档的"一致"结论。自己挑 3 组跨文档引用去核对原始文件——例如 D3 引用的某条硬红线 ID 是否真的存在于 D2、D7 基线集里用到的规则 ID 是否全部在 D2 有定义。发现文档标"一致"但实际不一致即 FAIL。
      2. 检查冲突清单是否真实存在冲突。如果七份文档确实有冲突而清单为空或只有形式化条目，判 FAIL（不允许"零冲突"这种不作为的结论）。
      3. 检查是否私自抹平了分歧——D2 与 D3 之间关于硬红线范围的真实分歧是否被显式保留并标为待裁决。
      4. 检查待确认清单是否覆盖了 D1–D7 中所有标注「待法务确认」「待医学复核」的条目（去原文中逐一核对）。
      5. 检查术语表是否覆盖了文档中实际出现的歧义术语。
      6. 检查"进入 Phase 1 的前置条件"是否每条都可验证（指明交付物与签字角色），而不是模糊表述。
      7. 检查合并过程是否引入了 D1–D7 之外的新规则。
      FAIL 条件：标注一致但实际不一致、冲突清单作伪或形式化、私自抹平分歧、待确认清单有遗漏、前置条件不可验证、引入了新规则。
    timeout_ms: 1800000
