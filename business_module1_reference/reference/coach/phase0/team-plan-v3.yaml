      `/workspace/output/phase0/D3-双轨门控合成规则.md`，必须包含：

      1. **双轨定义**：轨道 A（对话/话术 5 维度）逐维度定义 + 锚点（满分/中间分/零分各是什么样的话术）；轨道 B（专业知识运用：事实准确性 / 证据引用质量 / 场景适配性）逐项定义与锚点。**锚点必须用语料真实话术**（标出处），不要写"表述流畅得 4 分"这种不可校准的描述。

