      ## 关键框架调整（这是本任务的核心）
      本产品的知识库是**双层结构**，不是单一的三级来源：
      - **语料层（本课件库）**：培训教材层，提供拜访行为、话术、场景、异议模式、情绪、心理、商务术语等**可训练语料**。它**不等同于临床证据**，但对"陪练药代拜访行为"这个产品目标，它就是主知识库。
      - **临床层（说明书/指南/期刊）**：提供适应症、禁忌、用法用量、循证数据。对应产品中的"专业知识评分轨道"，**本次范围内不落地**，因语料不覆盖。

      ## 硬性纪律
      1. **禁止 web_search / web_fetch**。禁止编造法规文号、指南版本号、批号、临床数据。临床层查不到就写「临床层待补，不在本次范围」。
      2. 引用格式 `[课件编号 Slide号]`。
      3. **课件是培训材料，不是法律依据**——分级定义中必须写清这一层。
      4. **语料含违规灰色内容**（回扣/临床费/统方等），必须单独标记为"识别对象"而非"可推荐基准"。

      ## 你要交付的产物
      `/workspace/output/phase0/D5-知识来源分级与指纹.md`，必须包含：

      1. **双层来源分级定义**：
         - 语料层：Ⅰ级 = 课件原文（可回溯到具体 slide）；Ⅱ级 = 由课件原文归纳的结构化资产（`corpus_assets.jsonl`）；Ⅲ级 = 由前两级推导的产品设计规则（须标注为设计决策，不可作为事实基准）。
         - 临床层：说明书/指南/期刊的准入原则（**只写原则与占位字段，不填具体来源**）。
         每级写明：包含什么、不包含什么、争议优先级、能否作为"该知识点唯一正确表述"的依据。

      2. **准入与拒绝规则**：明确哪些不入库。**重点写清三类在本语料上真实存在的风险**：
         - 课件中的违规灰色内容（回扣/临床费/统方/二次公关）→ 拒绝作为基准，仅作识别对象（给出 `corpus_assets.jsonl` 中该条目的 `gray_area` 标记作为落地依据）
         - 课件中的过时/不适用内容（如某些年代久远的政策、已被行业淘汰的做法）→ 判定条件是什么
         - 未注明出处的"专家观点"、二次转述 → 拒绝
         给出每类可判定的拒绝条件。

      3. **来源指纹字段定义**：两类指纹并存：
         - `corpus_provenance`：课件编号、slide 号、原文定位、原文摘录、抽取方式（原文/归纳/推导）、抽取时间
         - `clinical_provenance`：来源类型、文献或说明书版本号、生效日期、审核人、原文定位、具体陈述（**本次全部留空 + 标注"临床层待补"**）
         给每个字段的类型、必填性、格式约束、示例值。给**可直接落库的 JSON Schema**（两套字段并存的结构）。

      4. **版本差异与废止机制**：如何记录"旧版 vs 新版"差异；旧版不删除、标记"已废止"并保留可追溯；新版本替代后如何反向标记受影响的场景卡、高频问题模板、评分基准。给差异记录的数据结构。**特别说明：语料层的"版本"是什么**（课件版本/修订批次/内部更新日期），以及语料层如何做周更。

      5. **知识缺口判定口径（关键）**：何时标记「不可评分」而非强行给分。至少覆盖：可信来源中不存在该知识点 / 多来源冲突无法判定 / 来源过旧且关键结论已变 / 所需信息超出本产品授权范围 / **语料层存在但内容本身违规不可推荐**（这一条是本产品特有的，必须写）。每种给判定条件与处理动作。

      6. **更新周期与 SLA**：说明书/警示语类 72 小时（工作日）、指南/共识类 1 周内完成审核入库；**语料层**单独一套（内部课件更新如何同步、谁负责、增量比对怎么做）。给分级 SLA 表 + 监测源清单类型，并诚实评估 1–2 名医学内容人员的现实可行性。

      7. **审核责任**：谁入库、谁审核、争议谁裁决。给审核人角色定义。

      边界：不写评分规则、不写合规红线、不写画像卡。
