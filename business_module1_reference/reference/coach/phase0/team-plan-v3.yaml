         - 合规触发 → 本轮不通过，不计入个人均分、不参与平均分稀释；组织层单独统计合规事件率。写清"不参与平均分"与"记为不通过"如何共存。
         - 两轨均通过 → 按权重合成。给初始权重（建议话术 60% / 知识 40%）与随资历上调知识权重的**具体公式或条件**（触发条件、步长、频次上限）。

      4. **可穷举性证明**：覆盖全部输入组合的真值表/决策表，至少含：合规通过/违规 × 知识达标/不达标/不可评分 × 话语术分高/低。每格唯一确定输出。说明决策树有多少叶节点。

      5. **非线性评分因子**：如何拉开区分度、防止"人人高分"。给因子定义 + 预期分布特征。

      6. **校准方案**：如何用带标准分的标注集回归、如何监控分布塌陷（给门槛指标）。

