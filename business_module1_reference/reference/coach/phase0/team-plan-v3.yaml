version: 1
plan:
  name: '药代拜访陪练 Agent · Phase 0 决策冻结（语料库驱动 · 多专家并行）'
  max_concurrency: 6
  max_consecutive_failures: 2
  max_cycles: 10
  auto_reject_retries: 1
tasks:
  # ============ Cycle 1：语料资产化 + 五条并行轨道 ============
  - id: d1-profile-schema
    title: 'D1 医生画像卡 schema v1'
    prompt: |
      ⚠️ **先读这个**：`/workspace/output/phase0/source/V1.3-口径变更.md` —— 产品方 V1.3 正式开发文档带来的 4 处口径变更，优先级高于下面所有材料（评分维度改名 / 题量不固定 / 「高频」改称候选训练考点 / 真伪裁判所改三段式分层）。改这 4 处，不要推倒重来。
      ✅ **D0 语料资产库已完成并由 owner 验收**（产出文件：`/workspace/output/phase0/D0-语料资产库.md`，1124 行 / 726 处引用 / 413 段引文，cite_check 校验 L1=L2=L3=web=文号=灰色语境 全 0）。**不要重做 D0，直接读它的产出文件**。它包含：异议类型体系（7 套分类法）、医生画像素材、拜访阶段映射、灰色手法隔离清单（64 条已定性，G-1～G-64）、48 条场景种子、覆盖缺口清单（18 条）、V1.3 口径落地自检。

      你负责 Phase 0 任务 D1：冻结「医生画像卡」的 schema。这是整个产品的入口数据结构，所有下游模块都以它为输入。

      ## 语料库（唯一权威事实来源）
      - 原文：`/workspace/output/phase0/corpus_txt/`（83 课件 / 4644 页，按 slide 切分，零改写）
      - 摘要：`/workspace/output/phase0/corpus_digest.md`（**先读这个**）
      - 资产：`/workspace/output/phase0/corpus_assets.md` + `corpus_assets.jsonl`（2255 条结构化资产）
      - 检索：`cd /workspace/output/phase0 && python3 corpus_search.py <关键词>`
      - 参考：`/workspace/output/phase0/source/任务拆解v1.md`（第 0 节 6 处调整、D1 行、附录数据结构）

      ## 硬性纪律
      1. **禁止 web_search / web_fetch**。禁止凭记忆补充法规、临床数据、药品名。语料查不到就写「语料未覆盖」。
      2. 引用格式 `[课件编号 Slide号]`，如 `[A1 S5]`。
      3. **DISC 四型**：语料中若没有 DISC 体系的记载，就明确写「DISC 为本产品引入的外部方法论，语料未覆盖」。不要假装它来自语料。
      4. **科室枚举只取语料中真实出现的科室**。语料没提到的科室列入「待补充」清单，不要臆造。

      ## 你要交付的产物
      `/workspace/output/phase0/D1-医生画像卡schema.md`，必须包含：

      1. **完整字段表**：字段名（英文 key）、中文名、取值域（枚举全部列出）、默认值、必填与否、所属层级（语气层 / 追问粒度层 / 提问内容层 / 交互形态层）、一句话「为什么需要它」、「不填会怎样」、**该字段取值范围的语料依据**（有则给 `[编号 Slide号]`，无则标「本产品设计决策」）。

      2. **标签池明细**：DISC 主/辅型、情绪标签池（≥8）、说话风格标签池（≥8）、追问三轴（追问深度 3 档 / 耐心度 3 档 / 关注点 4 类）。每个枚举值配一句**一线药代看得懂的白话解释**（业务语言，非内部黑话）。**凡能从语料找到依据的枚举值，必须给出处**——例如科室性格差异可直接引 `[A1 S5]`，医生关注点可引 `[A30 S4]`。

      3. **参数分层论证**：论证 DISC 只作用语气层、追问三轴作用追问粒度层，给出**正交性验证样例**——改语气字段时医生提问内容不变；改追问深度字段时语气不变。至少 2 组具体对照样例（用真实医生话术，不用抽象描述）。

      4. **无效字段识别**：逐字段自查——怎么选都不影响 AI 医生实际表现的字段就是无效设计，指出并给删除/改造建议。逐字段给判断依据。

      5. **JSON Schema**：可直接落库的 JSON Schema（draft-07 或 2020-12），字段名与字段表严格一致。

      6. **可用性走查**：第一次用这个界面的药代视角走查——能否 3 分钟配完？哪些字段易误选？给改进建议。

      7. **与 D0 的衔接**：说明画像卡的每个枚举值在 `corpus_assets.jsonl` 中对应哪类资产，便于后续扩充。

      边界：不写生成策略、不写评分规则、不写后端实现。不写合规红线表。
    assigned_to: product-designer
    depends_on: []
    verified_by:
      - Verifier
      - medical-affairs
    verify_prompt: |
      独立验证 /workspace/output/phase0/D1-医生画像卡schema.md，不要采信文档自述：
      1. **抽查引用真实性**：抽 8 条带 `[编号 Slide号]` 的枚举依据，回 `corpus_txt/` 核对原文是否真实存在且语义支撑该枚举值。张冠李戴即 FAIL。
      2. **逐字段比对**字段表与文末 JSON Schema：字段名、类型、枚举值、必填性四者严格一致。任何一处不一致即 FAIL。
      3. 检查任务拆解 D1 行的 3 条验收标准是否逐条覆盖：(a) 每字段有枚举/取值域/默认值；(b) 枚举值通过一线药代可理解性测试；(c) 有"同画像两个问题生成结果不同"的样例证明追问三轴生效。
      4. 正交性样例是否真能证明两件事（改语气不影响追问粒度、改追问粒度不影响语气）？样例必须具体到取值和预期话术，不能是口号。
      5. 无效字段是否逐个自查？某字段若全文找不到"它如何影响医生表现"的说明即判未论证。
      6. **检查科室枚举是否只含语料中真实出现的科室**。出现语料未提及的科室且未标「待补充」即 FAIL。
      7. 全文不得出现 web 来源、编造的法规/指南/临床数据引用。
      FAIL 条件：引用不实、schema 与字段表不一致、缺正交性样例、无效字段未自查、科室臆造、编造出处。

      **【统一验收清单 — V1.3 AT01–AT16】**
      V1.3 §5.3 的 16 个验收场景是产品方统一标准，**优先于本 prompt 自拟的验收标准**。
      与本任务最相关的条目请重点核验，其余在合并任务统一核验：

      AT01 只选科室未填专家 → 降级为通用科室训练，绝不捏造专家履历
      AT02 目标专家与另一作者同名 → 展示待核实，不直接绑定论文
      AT03 预测问题数量需因任务变化 → 题目数量可变、每题有选择理由，不能固定死 3 道
      AT04 新日报摘要尚未审核 → 可内部阅读，不可作为正式知识评分依据
      AT05 同一审核知识包切换医生情绪 → 医学答案及合规边界不变，语言风格可变
      AT06 代表语音报告"医生好像不认可" → 标注主观推测，不固化为医生人格事实
      AT07 员工自述医生问题的原话记不清 → 保留大意/不确定，不生成虚假逐字对话
      AT08 上次练过研究终点这次报告亚组证据 → 识别不同能力点并提出未覆盖候选，而非文字相似即命中
      AT09 无原预演计划却提交复盘 → 不计算预测命中率，可形成训练主题候选
      AT10 医学核验失败或审核拒绝 → 新内容无法发布，旧场景保持不变
      AT11 场景 V2 发布 → 显示新增何考点/为何新增/谁审核，支持恢复 V1
      AT12 专业内容错误但表述流畅 → 风险标记/不达标规则优先，不被沟通高分简单抵消
      AT13 当天未采集到新研究 → 显示真实空态或历史回顾标签，不编造今日最新
      AT14 文献撤稿或更正 → 找到受影响的知识卡/题目/日报条目并触发复核
      AT15 同一员工连续训练同一能力 → 记录独立于总分的能力轨迹，历史结果带版本和难度
      AT16 ASR 失误导致误判 → 用户可改正转写，重算评分或转人工复核

      **判定行必须是回复最后一行，单独成行：`VERDICT: PASS` 或 `VERDICT: FAIL`**（没有判定行会被引擎判失败并无限重试）。


    timeout_ms: 1800000

  - id: d2-compliance-rules
    title: 'D2 合规判定规则表（含语义方向判定）'
    prompt: |
      ⚠️ **先读这个**：`/workspace/output/phase0/source/V1.3-口径变更.md` —— 产品方 V1.3 正式开发文档带来的 4 处口径变更，优先级高于下面所有材料（评分维度改名 / 题量不固定 / 「高频」改称候选训练考点 / 真伪裁判所改三段式分层）。改这 4 处，不要推倒重来。
      ✅ **D0 语料资产库已完成并由 owner 验收**（产出文件：`/workspace/output/phase0/D0-语料资产库.md`，1124 行 / 726 处引用 / 413 段引文，cite_check 校验 L1=L2=L3=web=文号=灰色语境 全 0）。**不要重做 D0，直接读它的产出文件**。它包含：异议类型体系（7 套分类法）、医生画像素材、拜访阶段映射、灰色手法隔离清单（64 条已定性，G-1～G-64）、48 条场景种子、覆盖缺口清单（18 条）、V1.3 口径落地自检。

      你负责 Phase 0 任务 D2：冻结「合规判定规则表」。这是整个产品风险最高的一份文档——写错了会把诚实药代的合规拒绝话术判成违规，产品当场失去可信度。

      ## 语料库（唯一权威事实来源）
      - 原文：`/workspace/output/phase0/corpus_txt/`（83 课件 / 4644 页）
      - 摘要：`/workspace/output/phase0/corpus_digest.md`，**重点看第七节「合规高危原文集中清单」**
      - 资产：`/workspace/output/phase0/corpus_assets.md` —— **重点看「灰色手法隔离清单」**
      - 检索：`cd /workspace/output/phase0 && python3 corpus_search.py --or 回扣 返利 好处费 临床费 统方 不得 禁止 诋毁 夸大`
      - 参考：`/workspace/output/phase0/source/任务拆解v1.md`（模块 3 维度 5、风险 R5、Phase 0 的 D2 验收标准）

      ## 硬性纪律
      1. **禁止 web_search / web_fetch**。禁止编造法条编号、文号、发布机关、年份。语料查不到就写「语料未覆盖，正式依据待法务确认」。
      2. **课件是培训材料，不是法律依据**。每条红线必须标明它依据的是「培训教材所载规范」还是「本产品设计决策」，二者不可混淆。
      3. **语料中含违规灰色内容**（讲回扣/临床费/统方/二次公关）。这些只能作为**识别对象**和**违规正例素材**，绝不能写成推荐做法。
      4. 引用格式 `[课件编号 Slide号]`。

      ## 你要交付的产物
      `/workspace/output/phase0/D2-合规判定规则表.md`，必须包含：

      1. **判定链路设计**：**串行两段式**——第一段判定语境方向（提议/索要/提供 vs 拒绝/否定/劝阻 vs 中性陈述），第二段才做实体级违规匹配。第一段判为「拒绝/否定/劝阻」时，实体敏感词命中**一律不构成违规**。画出流程（文字或 SVG），写清为什么顺序不可颠倒——**注意：语料中的「真实异议 vs 虚假异议」之分正是这个设计的经验依据，引用它。**

      2. **语境方向分类器标签集**：枚举所有方向类别，每个给判定线索词 + 1 个真实例句（例句优先取自语料原文，标出处）。

      3. **硬红线清单**：规则ID、风险等级、判定条件、违规示例（药代第一人称原话）、**同词不同判的合规反例**（同一敏感词但因语境合规而不违规）、依据（`[编号 Slide号]` 或「本产品设计决策」或「待法务确认」）。
         至少覆盖：超适应症/超说明书推荐、承诺疗效、贬低竞品、诱导利益（回扣/返利/赞助个人）、以销量或处方量为条件的利益输送、未经授权使用他人姓名或病例、绝对化用语与无出处引用。
         **每条红线 ≥5 违规示例 + ≥5 合规反例。合规反例是硬要求**——同一条规则里敏感词必须相同，只有语境不同。

      4. **严重度分级**：「硬红线（一票否决）」vs「表述不规范（维度内扣分 + 即时提示）」，给判级标准。

      5. **一票否决后的计分处理**：明确该轮是否计入个人均分（建议：不计入，记入重练池，组织层单独统计合规事件率）。写清"不参与平均分"与"记为不通过"如何共存——不能两种口径并存。

      6. **误伤自查表**：站在「诚实、谨慎、专业的药代」立场逐条审查。列出可能被误伤的情形 + 防范机制。**语料中的合规拒绝范式（药代明确拒绝回扣/拒绝夸大）是这张表最有价值的素材来源**，请引用。

      7. **语料灰色内容处理说明**：明确声明——语料中的灰色做法如何被本产品识别并拒绝，以及这个"教材与合规冲突"的坑要在产品上如何提醒（不要照抄教材的灰色做法）。

      边界：不写画像卡、不写评分合成、不写后端代码。
    assigned_to: compliance-expert
    depends_on: []
    verified_by:
      - Verifier
      - scoring-architect
    verify_prompt: |
      独立对抗性验证 /workspace/output/phase0/D2-合规判定规则表.md，不要读文档自评结论：
      1. **构造攻击用例**：自己写 10 条药代话术（含 ≥4 条"拒绝/否定语境但含敏感词"，如"回扣这个我们真不能谈"），按文档判定链路逐步走一遍，记录每条判定。检查规则是否真能让这些全部判为合规。任一误判即 FAIL。
      2. **抽查引用真实性**：抽 6 条带 `[编号 Slide号]` 的红线依据，回 `corpus_txt/` 核对原文存在且语义支撑该规则。张冠李戴即 FAIL。
      3. 判定链路顺序确实是"先语境方向、后实体匹配"，拒绝语境豁免写成了明确可实现的条件。
      4. 每条红线都同时有违规示例与合规反例，且**反例中的敏感词与违规示例确为同一个词**。缺反例即 FAIL。
      5. 「一票否决后的计分处理」口径唯一、无自相矛盾。文中同时出现"不通过"和"从均分剔除"而无统一说明的判 FAIL。
      6. **编造法条检查**：全文不得有语料之外的法律依据。若有法规名称/文号/年份，核对是否来自语料；来自语料但被标为"法律依据"（而非"培训教材所载规范"）即 FAIL。
      7. **灰色内容检查**：语料中的回扣/临床费/统方等，若在任何一处被写成药代应当采取的做法，即 FAIL。
      8. 误伤自查表真实存在且有具体情形，不是空话。
      FAIL 条件：拒绝语境用例被误判、引用不实、红线缺合规反例、口径矛盾、杜撰法条、灰色内容被推荐、误伤自查缺失。

      **【统一验收清单 — V1.3 AT01–AT16】**
      V1.3 §5.3 的 16 个验收场景是产品方统一标准，**优先于本 prompt 自拟的验收标准**。
      与本任务最相关的条目请重点核验，其余在合并任务统一核验：

      AT01 只选科室未填专家 → 降级为通用科室训练，绝不捏造专家履历
      AT02 目标专家与另一作者同名 → 展示待核实，不直接绑定论文
      AT03 预测问题数量需因任务变化 → 题目数量可变、每题有选择理由，不能固定死 3 道
      AT04 新日报摘要尚未审核 → 可内部阅读，不可作为正式知识评分依据
      AT05 同一审核知识包切换医生情绪 → 医学答案及合规边界不变，语言风格可变
      AT06 代表语音报告"医生好像不认可" → 标注主观推测，不固化为医生人格事实
      AT07 员工自述医生问题的原话记不清 → 保留大意/不确定，不生成虚假逐字对话
      AT08 上次练过研究终点这次报告亚组证据 → 识别不同能力点并提出未覆盖候选，而非文字相似即命中
      AT09 无原预演计划却提交复盘 → 不计算预测命中率，可形成训练主题候选
      AT10 医学核验失败或审核拒绝 → 新内容无法发布，旧场景保持不变
      AT11 场景 V2 发布 → 显示新增何考点/为何新增/谁审核，支持恢复 V1
      AT12 专业内容错误但表述流畅 → 风险标记/不达标规则优先，不被沟通高分简单抵消
      AT13 当天未采集到新研究 → 显示真实空态或历史回顾标签，不编造今日最新
      AT14 文献撤稿或更正 → 找到受影响的知识卡/题目/日报条目并触发复核
      AT15 同一员工连续训练同一能力 → 记录独立于总分的能力轨迹，历史结果带版本和难度
      AT16 ASR 失误导致误判 → 用户可改正转写，重算评分或转人工复核

      **判定行必须是回复最后一行，单独成行：`VERDICT: PASS` 或 `VERDICT: FAIL`**（没有判定行会被引擎判失败并无限重试）。


    timeout_ms: 1800000

  - id: d3-scoring-gate
    title: 'D3 双轨门控合成规则'
    prompt: |
